name: device_info_plus_example
description: Demonstrates how to use the device_info_plus plugin.

dependencies:
  flutter:
    sdk: flutter
  device_info_plus:
    path: ../
  cupertino_icons: ^1.0.2
  # Required by the web-plugin demo (lib/web_plugin_demo_web.dart), which is
  # only compiled on the web platform.
  flutter_web_plugins:
    sdk: flutter
  web: ^1.1.0

dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.29.0'
