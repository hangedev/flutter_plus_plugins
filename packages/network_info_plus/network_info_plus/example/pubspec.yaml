name: network_info_plus_example
description: Demonstrates how to use the network_info_plus plugin.

environment:
  sdk: '>=2.18.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  network_info_plus:
    path: ../
  permission_handler: ^12.0.0+1
  cupertino_icons: ^1.0.2
  # The headless demo (lib/network_info_demo.dart) drives the plugin's FFI
  # Windows implementation directly, so it needs these as direct deps.
  ffi: ^2.0.1
  win32: ^5.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  test: ^1.21.0
  flutter_lints: ">=4.0.0 <6.0.0"

flutter:
  uses-material-design: true
